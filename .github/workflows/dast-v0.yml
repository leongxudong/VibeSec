name: VibeSec Optional DAST

on:
  workflow_dispatch:
    inputs:
      target:
        description: Authorised HTTP or HTTPS target
        required: true
        default: https://example.com
      authorisation:
        description: Type I AM AUTHORIZED
        required: true
        default: I AM AUTHORIZED

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify authorisation confirmation
        shell: bash
        run: |
          if [ "${{ github.event.inputs.authorisation }}" != "I AM AUTHORIZED" ]; then
            echo "Authorisation confirmation did not match required value."
            exit 2
          fi

      - name: Check out VibeSec
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install httpx and Nuclei
        shell: bash
        run: |
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/nuclei" -update-templates

      - name: Run VibeSec discovery and Nuclei
        shell: bash
        run: |
          python3 scripts/dast/vibesec_dast.py \
            --target "${{ github.event.inputs.target }}" \
            --output dast-results \
            --time-budget 240

      - name: Run OWASP ZAP baseline
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p dast-results/zap-work
          chmod 777 dast-results/zap-work
          docker run --rm \
            -v "$PWD/dast-results/zap-work:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ github.event.inputs.target }}" \
            -J zap.json -w zap.md -r zap.html -m 2 -I || true
          cp dast-results/zap-work/zap.json dast-results/zap.json 2>/dev/null || true
          cp dast-results/zap-work/zap.md dast-results/zap.md 2>/dev/null || true
          cp dast-results/zap-work/zap.html dast-results/zap.html 2>/dev/null || true

      - name: Merge scanner evidence and regenerate reports
        if: always()
        shell: bash
        run: |
          python3 scripts/dast/vibesec_dast.py \
            --target "${{ github.event.inputs.target }}" \
            --output dast-results \
            --report-only

      - name: Publish mobile-friendly summary
        if: always()
        shell: bash
        run: |
          if [ -f dast-results/vibesec-dast-summary.md ]; then
            cat dast-results/vibesec-dast-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# VibeSec DAST" >> "$GITHUB_STEP_SUMMARY"
            echo "No readable summary was produced. Check the workflow logs/artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload DAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibesec-dast-${{ github.run_id }}
          path: dast-results/
          if-no-files-found: warn
          retention-days: 7
