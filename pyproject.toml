[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesec"
version = "0.1.0"
description = "Explainable security review and AI-remediation handoff for rapidly developed web applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Xudong Leong"}]
dependencies = []

[project.scripts]
vibesec = "vibesec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
